<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Webfluence</title>
  <script>
    // GitHub Pages SPA redirect — encodes the path into the query string
    // so the main index.html can restore it via history.replaceState
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1).join('/') +
      '/?p=' + encodeURIComponent(l.pathname.slice(1) + l.search) +
      '&h=' + encodeURIComponent(l.hash.slice(1))
    );
  </script>
</head>
<body></body>
</html>
